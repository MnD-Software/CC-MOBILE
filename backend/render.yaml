services:
  - type: web
    name: cakecity-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: WOOCOMMERCE_STORE_URL
        value: https://cakecity.co.ke/wp-json/wc/store/v1
      - key: REDIS_URL
        sync: false
      - key: CLUB_EVENT_SECRET
        sync: false
      - key: WOOCOMMERCE_CONSUMER_KEY
        sync: false
      - key: WOOCOMMERCE_CONSUMER_SECRET
        sync: false
      - key: WOOCOMMERCE_WEBHOOK_SECRET
        sync: false
