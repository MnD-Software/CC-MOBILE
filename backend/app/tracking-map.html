<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
        background: #fff7fb;
        font-family: system-ui;
      }
      #notice {
        position: absolute;
        z-index: 500;
        bottom: 24px;
        left: 12px;
        right: 12px;
        background: white;
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 12px;
        color: #49302e;
        box-shadow: 0 3px 15px #32172d20;
      }
      .rider {
        border: 3px solid white;
        background: #b80068;
        border-radius: 50%;
        box-shadow: 0 2px 12px #32172d55;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: white;
      }
      .leaflet-control-attribution {
        font-size: 9px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="notice">Loading delivery map…</div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      let map,
        marker,
        destination,
        circle,
        lastBounds = "";
      function point(p) {
        return (
          p &&
          Number.isFinite(p.latitude) &&
          Number.isFinite(p.longitude) &&
          Math.abs(p.latitude) <= 90 &&
          Math.abs(p.longitude) <= 180
        );
      }
      window.renderTracking = function (data) {
        if (!window.L) {
          document.getElementById("notice").textContent =
            "Map unavailable. Your delivery updates are still shown below.";
          return;
        }
        if (!data || data.type !== "cakecity-live-map") return;
        if (!map) {
          map = L.map("map", { scrollWheelZoom: false }).setView(
            [-1.2864, 36.8172],
            12,
          );
          L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>',
          }).addTo(map);
        }
        const p = data.position,
          d = data.destination;
        if (point(p)) {
          const xy = [p.latitude, p.longitude];
          if (!marker) {
            marker = L.marker(xy, {
              icon: L.divIcon({
                className: "rider",
                html: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="17" r="3.5"/><circle cx="19" cy="17" r="3.5"/><path d="m5 17 5-9 5 9H5m5-9h6l3 9M8 6h4m4-2h3l1 4"/></svg>',
                iconSize: [36, 36],
                iconAnchor: [18, 18],
              }),
            }).addTo(map);
          } else marker.setLatLng(xy);
          marker.setOpacity(p.stale ? 0.5 : 1);
          if (circle) map.removeLayer(circle);
          circle = L.circle(xy, {
            radius: Math.min(200, Math.max(0, p.accuracy || 0)),
            color: "#b80068",
            weight: 1,
            fillOpacity: 0.06,
          }).addTo(map);
        } else {
          if (marker) {
            map.removeLayer(marker);
            marker = null;
          }
          if (circle) {
            map.removeLayer(circle);
            circle = null;
          }
        }
        if (point(d)) {
          const xy = [d.latitude, d.longitude];
          if (!destination)
            destination = L.circleMarker(xy, {
              radius: 9,
              color: "#fff",
              weight: 3,
              fillColor: "#32172d",
              fillOpacity: 1,
            })
              .addTo(map)
              .bindTooltip("Delivery destination");
          else destination.setLatLng(xy);
        } else if (destination) {
          map.removeLayer(destination);
          destination = null;
        }
        const bounds = [p, d]
          .filter(point)
          .map((v) => [v.latitude, v.longitude]);
        const key = JSON.stringify(
          bounds.map((v) => v.map((n) => n.toFixed(3))),
        );
        if (bounds.length && key !== lastBounds) {
          map.fitBounds(L.latLngBounds(bounds), {
            padding: [50, 60],
            maxZoom: 16,
            animate: false,
          });
          lastBounds = key;
        }
        document.getElementById("notice").textContent = point(p)
          ? p.stale
            ? "Last known rider location · waiting for an update"
            : point(d)
              ? "Rider location · destination shown in cocoa"
              : "Rider location · GPS updates"
          : "Waiting for your rider to share their location";
      };
      window.addEventListener("message", (event) => {
        if (event.source === window.parent) window.renderTracking(event.data);
      });
      const ready = JSON.stringify({ type: "cakecity-map-ready" });
      if (window.ReactNativeWebView)
        window.ReactNativeWebView.postMessage(ready);
      else window.parent.postMessage({ type: "cakecity-map-ready" }, "*");
    </script>
  </body>
</html>
